apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-workflow-testing-site
  namespace: agent-workflow-testing
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Agent Workflow Testing</title>
        <style>
          body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111827;
            color: #f9fafb;
          }
          main {
            max-width: 40rem;
            padding: 2rem;
          }
          h1 {
            margin-top: 0;
          }
          code {
            color: #93c5fd;
          }
        </style>
      </head>
      <body>
        <main>
          <p>Plural GitOps example workload</p>
          <h1>agent-workflow-testing</h1>
          <p>
            This static page is deployed from <code>manifests/app</code> through the
            repository's <code>ServiceDeployment</code> object.
          </p>
        </main>
      </body>
    </html>
