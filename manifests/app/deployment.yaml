apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-workflow-testing-site
  namespace: agent-workflow-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-workflow-testing-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-workflow-testing-site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: site-content
          configMap:
            name: agent-workflow-testing-site
